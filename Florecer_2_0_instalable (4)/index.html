</style></head><body><main><div class="muted">🌷 Un espacio solo para mí</div><h1>Florecer</h1><p class="muted">Pequeños pasos, noches tranquilas y nuevos comienzos.</p><nav id="nav"></nav><section id="home"></section><section id="rutinas" class="hide"></section><section id="habitos" class="hide"></section><section id="diario" class="hide"></section><section id="ideas" class="hide"></section><section id="progreso" class="hide"></section><section id="lecturas" class="hide"></section><section id="alimentacion" class="hide"></section><section id="caminatas" class="hide"></section><section id="peso" class="hide"></section><section id="alarmas" class="hide"></section><div class="bottom" id="bottom"></div><p class="small muted">Tus registros se guardan solo en este navegador y dispositivo. Si borras los datos del navegador, podrían perderse. No es una aplicación médica ni envía recordatorios automáticos.</p></main><script>
const sections={home:'Inicio',rutinas:'Rutinas',habitos:'Hábitos',diario:'Mi diario',ideas:'Actividades',progreso:'Progreso',lecturas:'Lecturas y respaldo'};const $=id=>document.getElementById(id);const key='florecer-v1';let data={};try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const save=()=>{try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){alert('No se pudo guardar. Abre la aplicación en Safari y exporta una copia de seguridad.');return false}};const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function switchTo(id){Object.keys(sections).forEach(k=>$(k).classList.toggle('hide',k!==id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));}Object.entries(sections).forEach(([id,name])=>{let b=document.createElement('button');b.textContent=name;b.dataset.id=id;b.onclick=()=>switchTo(id);$('nav').append(b)});
$('home').innerHTML=`<div class="card"><span class="chip">Mi propósito</span><h2>Un día a la vez 💗</h2><p>No necesito hacerlo perfecto. Hoy puedo cuidar mi descanso, mi cuerpo y mi tranquilidad.</p><p>🌙 Sin redes ni juegos después de las <b>9:00 p. m.</b></p><p>🚶‍♀️ Caminar de 15 a 20 minutos, aumentando poco a poco.</p><p>📖 Leer o escribir cada noche.</p></div><div class="card"><h2>Mis horarios</h2><p>Meta progresiva: adelantar la hora de despertar de 8:30 a 6:00 a. m., cuidando 7 a 9 horas de sueño.</p><p>Al despertar: agua, luz natural y caminata en un lugar seguro.</p></div>`;
$('rutinas').innerHTML=`<div class="card"><h2>☀️ Mañana</h2><p>1. Despertar sin abrir redes.<br>2. Beber agua y asearme.<br>3. Caminar 15–20 minutos; aumentar a 30 según tolerancia.<br>4. Desayunar y planificar el día.</p></div><div class="card"><h2>🌙 Noche</h2><p><b>8:30</b> Últimos mensajes y preparar ropa.<br><b>9:00</b> Guardar el teléfono; sin juegos ni redes.<br><b>9:00–9:30</b> Ducha y cuidado personal.<br><b>9:30–10:00</b> Leer o escribir.<br><b>10:00</b> Acostarme cuando tenga sueño.</p></div><div class="card"><h2>⏰ Transición al despertar</h2><p>Días 1–3: 8:00 · Días 4–6: 7:30 · Días 7–9: 7:00 · Días 10–12: 6:30 · Desde el día 13: 6:00 a. m.</p><p class="muted">Adapta los tiempos si aún no estás durmiendo lo suficiente.</p></div>`;
const habits=['No abrí redes los primeros 30 minutos','Respeté mis límites de redes y juegos','Caminé o me moví un poco','Hice una actividad sin pantalla','Dejé redes y juegos a las 9:00 p. m.','Me traté con paciencia'];function renderHabits(){let k='h-'+today();$('habitos').innerHTML=`<div class="card"><h2>Mis hábitos de hoy</h2><p class="muted">${today()} · Marca lo que sí lograste</p>${habits.map((h,i)=>`<label><input type="checkbox" data-h="${i}" ${(data[k]||[]).includes(i)?'checked':''}>${h}</label>`).join('')}</div>`;document.querySelectorAll('[data-h]').forEach(el=>el.onchange=()=>{let a=data[k]||[],i=+el.dataset.h;data[k]=el.checked?[...new Set([...a,i])]:a.filter(x=>x!==i);save()})}renderHabits();
const prompts=['¿Qué comienzo pequeño puedo regalarme mañana?','¿Qué cualidad mía permanece en los días difíciles?','¿Cómo puedo descansar con más amabilidad?','¿Cuál es mi siguiente paso posible?','¿A quién puedo acercarme esta semana?','¿Qué comparación quiero soltar?','¿Qué frase amable necesito escuchar?','¿Qué me ayuda a volver al presente?','¿Qué hábito pequeño quiero cuidar?','¿Cómo puedo cuidar mi cuerpo con cariño?','¿A quién puedo pedir apoyo?','¿Qué puedo dejar para mañana?','¿Qué agradezco hoy?','¿Qué me gustaría perdonarme?','¿Qué posibilidad quiero mantener abierta?','¿Qué límite necesito respetar?','¿Qué actividad sencilla me alegra?','¿Qué emoción necesita atención?','¿Qué avance quiero reconocer?','¿Qué puedo hacer y qué debo soltar?','¿Qué significa florecer para mí?'];$('diario').innerHTML=`<div class="card"><h2>📖 Mi diario</h2><p>Elige una de las 21 reflexiones y escribe lo que sientes.</p><select id="day" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd">${prompts.map((p,i)=>`<option value="${i}">Noche ${i+1}</option>`).join('')}</select><p id="prompt"></p><textarea id="entry" placeholder="Hoy quiero contarme..."></textarea><p><button id="saveEntry">Guardar mi reflexión</button></p><p id="saved" class="muted small"></p></div><div class="card"><h2>Oración breve</h2><p>Dios, acompáñame en este camino. Dame serenidad para descansar, paciencia para aprender y esperanza para comenzar de nuevo. Amén.</p></div>`;function loadDay(){let i=+$('day').value;$('prompt').textContent=prompts[i];$('entry').value=data['entry-'+i]||'';$('saved').textContent=''}$('day').onchange=loadDay;$('saveEntry').onclick=()=>{data['entry-'+$('day').value]=$('entry').value;save();$('saved').textContent='Guardado en este dispositivo ✓'};loadDay();
$('ideas').innerHTML=`<div class="card"><h2>Cuando siento aburrimiento</h2><p>Leer 10 páginas, cocinar algo sencillo, ordenar un rincón, hacer un rompecabezas físico o caminar.</p></div><div class="card"><h2>Cuando siento ansiedad</h2><p>Respirar lentamente, nombrar cinco cosas que veo, escribir lo que siento o llamar a alguien de confianza.</p></div><div class="card"><h2>Cuando siento soledad</h2><p>Enviar un mensaje a alguien querido, organizar una salida o participar en una actividad comunitaria.</p></div><div class="card"><h2>Cuando quiero agarrar el teléfono</h2><p>Esperar cinco minutos, dejarlo fuera de alcance y elegir una actividad corta. No necesito castigarme si lo vuelvo a usar.</p></div>`;
$('progreso').innerHTML=`<div class="card"><h2>📊 Mi registro diario</h2><p>Escribe cuánto tiempo dedicaste a redes y juegos hoy.</p><label>Redes sociales (minutos)<input id="social" type="number" min="0" max="1440"></label><label>Juegos (minutos)<input id="games" type="number" min="0" max="1440"></label><label>Caminata (minutos)<input id="walk" type="number" min="0" max="600"></label><button id="saveProgress">Guardar día</button><p id="progressNote" class="muted"></p></div><div class="card"><h2>Mis metas graduales</h2><p>Semana 1: redes + juegos hasta 6 horas.<br>Semana 2: hasta 4 horas.<br>Semana 3: hasta 2 horas.</p><p class="muted">Son metas flexibles, no reglas para juzgarte.</p><div id="history"></div></div>`;function loadProgress(){let x=data['progress-'+today()]||{};['social','games','walk'].forEach(k=>$(k).value=x[k]??'');let records=Object.keys(data).filter(k=>k.startsWith('progress-')).sort().reverse().slice(0,14);$('history').innerHTML=records.map(k=>`<p class="line"><b>${k.slice(9)}</b> · Redes ${data[k].social||0} min · Juegos ${data[k].games||0} min · Caminata ${data[k].walk||0} min</p>`).join('')||'<p class="muted">Tus registros aparecerán aquí.</p>'}$('saveProgress').onclick=()=>{let x={};['social','games','walk'].forEach(k=>x[k]=Math.max(0,Number($(k).value)||0));data['progress-'+today()]=x;save();loadProgress();$('progressNote').textContent='Registro guardado ✓'};loadProgress();$('lecturas').innerHTML=`<div class="card"><h2>📚 Mis lecturas</h2><p>Registra tu libro, páginas y una idea que quieras recordar. No necesitas comprar ningún libro para empezar.</p><label>Libro o lectura<input id="book" type="text" placeholder="Título del libro" maxlength="160"></label><label>Páginas leídas hoy<input id="pages" type="number" min="0" max="10000"></label><label>Lo que aprendí o sentí<textarea id="readingNote" placeholder="Hoy me quedo con..."></textarea></label><button id="saveReading">Guardar lectura</button><p id="readingSaved" class="muted"></p><div id="readingHistory"></div></div><div class="card"><h2>💾 Mis copias de seguridad</h2><p>Exporta tus datos regularmente. El archivo JSON conserva tus registros y puede importarse de nuevo en esta aplicación.</p><button id="exportData">Descargar mi respaldo</button><label>Restaurar un respaldo anterior<input id="importData" type="file" accept=".json,application/json"></label><p class="small muted">Importar reemplaza los datos guardados actualmente en este navegador. Guarda primero una copia de los actuales.</p></div>`;
const readingHistory=()=>{let rows=Object.keys(data).filter(k=>k.startsWith('reading-')).sort().reverse().slice(0,30);$('readingHistory').innerHTML=rows.map(k=>{let r=data[k];let p=document.createElement('p');p.className='line';p.textContent=`${k.slice(8)} · ${r.book||'Sin título'} · ${r.pages||0} páginas · ${r.note||''}`;return p.outerHTML}).join('')||'<p class="muted">Tus lecturas aparecerán aquí.</p>'};
$('saveReading').onclick=()=>{data['reading-'+today()]={book:$('book').value.trim(),pages:Math.max(0,Number($('pages').value)||0),note:$('readingNote').value};if(save())$('readingSaved').textContent='Lectura guardada ✓';readingHistory()};
$('exportData').onclick=()=>{let blob=new Blob([JSON.stringify({app:'Florecer',version:2,records:data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Florecer_respaldo_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
$('importData').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.app!=='Florecer'||!x.records||typeof x.records!=='object'||Array.isArray(x.records))throw Error('Archivo no válido');if(!confirm('¿Reemplazar los registros actuales por este respaldo?'))return;data=x.records;if(save())location.reload()}catch(err){alert('No se pudo importar. Selecciona un respaldo JSON exportado desde Florecer.')}};
readingHistory();switchTo('home');

newNav.forEach(([id,label])=>{let b=document.createElement('button');b.textContent=label;b.dataset.id=id;b.onclick=()=>switchTo(id);$('bottom').appendChild(b)});

[['2 huevos con espinaca, 2 tortillas, queso fresco 30 g y papaya',410],['120 g pescado, ¾ taza arroz, ½ taza frijoles, ensalada y aguacate',550],['Sopa de pollo 100 g, papa, zanahoria, ayote y 2 tortillas',420],['Fruta pequeña',80]],
[['½ taza frijoles, 2 huevos, 2 tortillas y naranja',430],['120 g pollo guisado, ½ taza arroz, ½ taza frijoles, verduras y aguacate',560],['2 calabacines pequeños, 100 g carne magra, papa, zanahoria, 20 g cheddar y 2 tortillas',410],['Yogur natural',95]],
[['Avena ½ taza seca, leche, ½ banano y huevo',385],['120 g pollo, ¾ taza arroz, ½ taza frijoles y ensalada',570],['2 tortillas, 2 huevos, queso fresco 30 g, ⅓ taza frijoles',410],['Manzana pequeña',80]],

];

function renderMenu(){let i=Number($('mealDay').value);let labels=['☀️ Desayuno · 7:00','🍲 Almuerzo · 12:30','🌙 Cena · 18:30','🍎 Merienda opcional · 16:00'];$('mealRows').innerHTML=menu[i].map((m,j)=>`<div class="meal"><b>${labels[j]}</b> <span class="tag">${m[1]} kcal</span><p>${m[0]}</p></div>`).join('')+`<p><b>Total estimado: ${menu[i].reduce((s,m)=>s+m[1],0)} kcal</b></p><p class="note">Horarios meta para la semana 4. Durante la transición, ajusta el desayuno según tu hora de despertar. No es necesario saltarse comidas.</p>`}
$('mealDay').value=(new Date().getDay()+6)%7;$('mealDay').onchange=renderMenu;renderMenu();

$('caminatas').innerHTML=`<div class="hero"><h2>🚶 Mis pasos cuentan</h2><p>Empieza con caminatas suaves. Los pasos se registran manualmente; esta aplicación no puede leer directamente los pasos de Apple Health.</p></div><div class="card"><h2>Hoy</h2><label>Pasos caminados <input id="stepsInput" type="number" min="0" max="100000" placeholder="Ej. 2500"></label><label>Minutos de caminata <input id="minutesInput" type="number" min="0" max="600" placeholder="Ej. 15"></label><button id="saveSteps">Guardar mis pasos</button><p id="stepSaved" class="note"></p></div><div class="card"><h2>Últimos 7 días</h2><div id="stepGraph"></div></div><div class="card"><h2>Mi avance gradual</h2><p>Semana 1: despertar 7:30 y caminar 10–15 min.<br>Semana 2: 7:00 y caminar 15 min.<br>Semana 3: 6:30 y caminar 15–20 min.<br>Semana 4: 6:00 y caminar 20–30 min.</p><p class="note">Evita humo o frío que desencadene síntomas de asma; detente si tienes dificultad respiratoria.</p></div>`;
function dateKey(offset){let d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderSteps(){let x=data['steps-'+today()]||{};$('stepsInput').value=x.steps??'';$('minutesInput').value=x.minutes??'';let vals=Array.from({length:7},(_,i)=>({day:dateKey(i-6),steps:(data['steps-'+dateKey(i-6)]||{}).steps||0}));let max=Math.max(1000,...vals.map(v=>v.steps));$('stepGraph').innerHTML=`<div class="bars">${vals.map(v=>`<div style="flex:1;text-align:center"><div class="note">${v.steps||'·'}</div><div class="bar" style="height:${Math.max(3,v.steps/max*105)}px"></div><div class="barlabel">${v.day.slice(5)}</div></div>`).join('')}</div>`}
$('saveSteps').onclick=()=>{let steps=Number($('stepsInput').value),minutes=Number($('minutesInput').value);if(!Number.isFinite(steps)||!Number.isFinite(minutes)||steps<0||steps>100000||minutes<0||minutes>600){alert('Revisa los valores ingresados');return}data['steps-'+today()]={steps,minutes};if(save())$('stepSaved').textContent='Tus pasos se guardaron ✓';renderSteps()};renderSteps();
$('peso').innerHTML=`<div class="hero"><h2>⚖ Mi progreso, sin presión</h2><p>Punto de partida: 79.09 kg · Objetivo orientativo: 53 kg. Tu primera meta puede ser 75 kg.</p></div><div class="card"><h2>Registro semanal</h2><label>Fecha <input type="date" id="weightDate"></label><label>Peso en kilogramos <input type="number" id="weightValue" min="20" max="300" step="0.01" placeholder="Ej. 79.09"></label><button id="saveWeight">Guardar peso</button><p class="note">Una vez a la semana es suficiente. No necesitas pesarte todos los días.</p><p id="weightSaved" class="note"></p></div><div class="card"><h2>Mi evolución</h2><div id="weightHistory"></div></div>`;
$('weightDate').value=today();function renderWeights(){let arr=(data.weights||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));$('weightHistory').innerHTML=arr.length?`<div class="bars">${arr.slice(-8).map(v=>`<div style="flex:1;text-align:center"><div class="note">${v.kg}</div><div class="bar" style="height:${Math.max(12,(v.kg-45)/55*105)}px"></div><div class="barlabel">${v.date.slice(5)}</div></div>`).join('')}</div><p>${arr.slice().reverse().map(v=>`${v.date}: <b>${v.kg.toFixed(2)} kg</b>`).join('<br>')}</p>`:'<p class="note">Tu primer registro aparecerá aquí.</p>'}
$('saveWeight').onclick=()=>{let kg=Number($('weightValue').value),date=$('weightDate').value;if(!date||!Number.isFinite(kg)||kg<20||kg>300){alert('Ingresa una fecha y un peso válido');return}data.weights=(data.weights||[]).filter(x=>x.date!==date);data.weights.push({date,kg});if(save())$('weightSaved').textContent='Registro guardado ✓';renderWeights()};renderWeights();
$('alarmas').innerHTML=`<div class="hero"><h2>⏰ Mis recordatorios</h2><p>Elige los horarios que quieres seguir y configura las alarmas en Reloj del iPad o iPhone.</p></div><div class="card"><h2>Mis horarios</h2><div id="alarmRows"></div><button id="saveAlarms">Guardar horarios</button><p id="alarmSaved" class="note"></p></div><div class="card"><h2>🔔 Importante</h2><p>Florecer no puede hacer sonar una alarma fiable cuando está cerrada. Para despertar a las 6:00 a. m., abre la app <b>Reloj</b> de tu iPad o iPhone, entra a <b>Alarmas</b> y crea una alarma repetida.</p><p>Para recordatorios de comidas y descanso, puedes usar <b>Recordatorios</b> de Apple.</p></div>`;
const alarmDefaults=[['Despertar','06:00'],['Caminata','06:15'],['Desayuno','07:00'],['Almuerzo','12:30'],['Merienda','16:00'],['Cena','18:30'],['Guardar celular','21:00'],['Dormir','22:00']];$('alarmRows').innerHTML=alarmDefaults.map(([n,t],i)=>`<label>${n} <input type="time" data-alarm="${i}" value="${(data.alarms||{})[i]||t}"></label>`).join('');$('saveAlarms').onclick=()=>{data.alarms={};document.querySelectorAll('[data-alarm]').forEach(e=>data.alarms[e.dataset.alarm]=e.value);if(save())$('alarmSaved').textContent='Horarios guardados ✓. Recuerda programar las alarmas reales en Reloj.'};
